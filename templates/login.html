<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — MediShield AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-card glass">
    <div class="brand text-center mb-3">
      <i class="bi bi-shield-lock-fill"></i>
      <h3>MediShield AI</h3>
      <p class="text-muted small">Secure Healthcare Data Privacy</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{cat}} py-2">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person"></i> Username</label>
        <input name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-lock"></i> Password</label>
        <input name="password" type="password" class="form-control" required>
      </div>
      <button class="btn btn-glow w-100"><i class="bi bi-box-arrow-in-right"></i> Sign In</button>
    </form>
  </div>
</body>
</html>

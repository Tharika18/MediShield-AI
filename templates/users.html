{% extends "base.html" %}
{% block pagetitle %}Users{% endblock %}
{% block content %}
<div class="glass card-pad mb-3">
  <h5><i class="bi bi-person-plus"></i> Create User</h5>
  <form method="POST" class="row g-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="create">
    <div class="col-md-3"><input name="username" class="form-control" placeholder="Username" required></div>
    <div class="col-md-3"><input name="email" class="form-control" placeholder="Email" required></div>
    <div class="col-md-3"><input name="full_name" class="form-control" placeholder="Full Name" required></div>
    <div class="col-md-2"><input name="password" type="password" class="form-control" placeholder="Password" required></div>
    <div class="col-md-1"><select name="role_id" class="form-select">{% for r in roles %}<option value="{{r.id}}">{{r.name}}</option>{% endfor %}</select></div>
    <div class="col-12 mt-2"><button class="btn btn-glow"><i class="bi bi-plus"></i> Create</button></div>
  </form>
</div>

<div class="glass card-pad">
  <div class="table-responsive">
    <table class="table table-dark align-middle">
      <thead><tr><th>ID</th><th>Username</th><th>Full Name</th><th>Role</th><th>Active</th><th></th></tr></thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>{{ u.id }}</td>
          <td>{{ u.username }}</td>
          <td>{{ u.full_name }}</td>
          <td><span class="badge bg-info">{{ u.role.name }}</span></td>
          <td>{{ 'Yes' if u.is_active else 'No' }}</td>
          <td class="text-end">
            <form method="POST" class="d-inline">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <input type="hidden" name="action" value="toggle">
              <input type="hidden" name="user_id" value="{{ u.id }}">
              <button class="btn btn-sm btn-outline-{{ 'danger' if u.is_active else 'success' }}">
                {{ 'Disable' if u.is_active else 'Enable' }}
              </button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

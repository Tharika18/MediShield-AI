{% extends "base.html" %}
{% block pagetitle %}New Patient{% endblock %}
{% block content %}
<div class="glass card-pad">
  <h5><i class="bi bi-person-plus"></i> Create Patient</h5>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">First Name</label><input name="first_name" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Last Name</label><input name="last_name" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">Date of Birth</label><input type="date" name="date_of_birth" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">Gender</label>
        <select name="gender" class="form-select"><option>Male</option><option>Female</option><option>Other</option></select>
      </div>
      <div class="col-md-4"><label class="form-label">Phone</label><input name="phone" class="form-control"></div>
      <div class="col-12"><label class="form-label">Address</label><input name="address" class="form-control"></div>
      {% if current_user.role and current_user.role.name in ['Admin', 'Doctor'] %}
      <div class="col-md-6"><label class="form-label">SSN (encrypted)</label><input name="ssn" class="form-control"></div>
      <div class="col-md-6"><label class="form-label">Medical History (encrypted)</label><textarea name="medical_history" class="form-control" rows="2"></textarea></div>
      <div class="col-md-4"><label class="form-label">Diagnosis (encrypted)</label><textarea name="diagnosis" class="form-control" rows="2"></textarea></div>
      <div class="col-md-4"><label class="form-label">Prescriptions (encrypted)</label><textarea name="prescriptions" class="form-control" rows="2"></textarea></div>
      <div class="col-md-4"><label class="form-label">Lab Reports (encrypted)</label><textarea name="lab_reports" class="form-control" rows="2"></textarea></div>
      {% endif %}
    </div>
    <button class="btn btn-glow mt-3"><i class="bi bi-check2"></i> Save Patient</button>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block pagetitle %}My Profile & Settings{% endblock %}
{% block content %}
<div class="row g-4">
    <div class="col-lg-6">
        <div class="glass card-pad">
            <h4 class="mb-3"><i class="bi bi-person-circle"></i> Edit Profile</h4>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="action" value="profile">
                <div class="mb-3"><label class="form-label">Full Name</label><input class="form-control" name="full_name" value="{{ current_user.full_name }}" required maxlength="120"></div>
                <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ current_user.email }}" required maxlength="120"></div>
                <div class="mb-3"><label class="form-label">Username</label><input class="form-control" value="{{ current_user.username }}" disabled></div>
                <div class="mb-3"><label class="form-label">Role</label><input class="form-control" value="{{ current_user.role.name if current_user.role else '—' }}" disabled></div>
                <button class="btn btn-glow" type="submit">Save Profile</button>
            </form>
        </div>
    </div>
    <div class="col-lg-6" id="password-section">
        <div class="glass card-pad">
            <h4 class="mb-3"><i class="bi bi-key"></i> Change Password</h4>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="action" value="password">
                <div class="mb-3"><label class="form-label">Current Password</label><input class="form-control" type="password" name="current_password" required></div>
                <div class="mb-3"><label class="form-label">New Password</label><input class="form-control" type="password" name="new_password" minlength="8" required></div>
                <div class="mb-3"><label class="form-label">Confirm New Password</label><input class="form-control" type="password" name="confirm_password" minlength="8" required></div>
                <button class="btn btn-glow" type="submit">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
